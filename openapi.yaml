
openapi: 3.0.3

info:
  title: Clinic Management API
  version: 1.0.0
  description: API documentation for the clinic management system.

servers:
  - url: http://localhost:5000
    description: Development server

paths:
  /api/v1/auth/signout:
    post:
      summary: Sign out and revoke the current tokens
      tags:
        - Authentication
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Tokens revoked
        "401":
          description: Invalid or expired token

  /api/v1/auth/login:
    post:
      summary: Login a user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Login successful
        "401":
          description: Invalid credentials

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
